name: egresados2

services:
  egresados2-db:
    image: postgres:16-alpine
    container_name: egresados2-db
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
      -c max_connections=30
    environment:
      POSTGRES_USER: ${DB_USER:-egresados_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-egresados_db}
    # SIN bloque "ports:" hacia el host para no colisionar con otras BD del VPS
    expose:
      - "5432"
    volumes:
      - egresados2-pgdata:/var/lib/postgresql/data
    networks:
      - egresados2-net
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  egresados2-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egresados2-backend
    networks:
      egresados2-net:
        aliases:
          - backend
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      PORT: 3000
      DB_HOST: egresados2-db
      DB_PORT: 5432
      CORS_ORIGIN: ${CORS_ORIGIN:-http://187.41.117.126:8084}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-3004}:3000"
    volumes:
      - ./backend/multimedia:/usr/src/app/backend/multimedia
    depends_on:
      egresados2-db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  egresados2-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: egresados2-frontend
    ports:
      - "${FRONTEND_PORT:-8084}:80"
    depends_on:
      - egresados2-backend
    networks:
      - egresados2-net
    restart: unless-stopped
    mem_limit: 64m

volumes:
  egresados2-pgdata:
    name: egresados2-pgdata

networks:
  egresados2-net:
    name: egresados2-net
    driver: bridge
