<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña - Registro de Egresados</title>
  <link rel="stylesheet" href="/styles.css?v=20261117c" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container" style="max-width: 440px;">
    <div class="card">
      <h1>Recuperar contraseña</h1>
      <p class="hint" style="margin-bottom: 16px;">
        Ingresa tu correo electrónico registrado. Te enviaremos un enlace seguro para que puedas restablecer tu contraseña.
      </p>
      <div id="alertBox"></div>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" placeholder="tu.correo@ejemplo.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Enviar enlace de recuperación</button>
      </form>
      <p class="hint" style="margin-top:16px; text-align: center;">
        <a href="/login.html" style="font-weight: 600;">← Volver al inicio de sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js?v=20261117c"></script>
  <script src="/js/ui.js?v=20261117c"></script>
  <script src="/js/recuperar-password.js?v=20261117c"></script>
</body>
</html>
