<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña - Registro de Egresados</title>
  <link rel="stylesheet" href="/styles.css?v=20261117c" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container" style="max-width: 440px;">
    <div class="card">
      <h1>Nueva contraseña</h1>
      <p class="hint" style="margin-bottom: 16px;">
        Escribe y comprueba tu nueva contraseña (mínimo 8 caracteres).
      </p>
      <div id="alertBox"></div>
      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">Nueva contraseña *</label>
          <input type="password" id="newPassword" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar nueva contraseña *</label>
          <input type="password" id="confirmPassword" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Repite la nueva contraseña" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Guardar nueva contraseña</button>
      </form>
      <p class="hint" style="margin-top:16px; text-align: center;">
        <a href="/login.html" style="font-weight: 600;">← Ir al inicio de sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js?v=20261117c"></script>
  <script src="/js/ui.js?v=20261117c"></script>
  <script src="/js/restablecer-password.js?v=20261117c"></script>
</body>
</html>
