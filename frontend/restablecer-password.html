<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña - Registro de Graduados UAJMS</title>
  <link rel="stylesheet" href="/styles.css?v=20261124_colores" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container auth-page-container">
    <div class="auth-center-card card">
      <div class="auth-form-header">
        <h1>Nueva contraseña</h1>
        <p class="muted">
          Escribe y confirma tu nueva contraseña institucional (mínimo 8 caracteres).
        </p>
      </div>

      <div id="alertBox"></div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">Nueva contraseña *</label>
          <input type="password" id="newPassword" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar nueva contraseña *</label>
          <input type="password" id="confirmPassword" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Repite la nueva contraseña" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Guardar nueva contraseña</button>
      </form>

      <p class="hint" style="margin-top: 20px; text-align: center;">
        <a href="/login.html" class="auth-link-back">← Ir al inicio de sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js?v=20261117c"></script>
  <script src="/js/ui.js?v=20261117c"></script>
  <script src="/js/restablecer-password.js?v=20261124_colores"></script>
</body>
</html>
