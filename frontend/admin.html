<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión - Registro de Graduados UAJMS</title>
  <link rel="stylesheet" href="/styles.css?v=20261124_colores" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container admin-page">
    <div class="page-header flex-between" style="flex-wrap: wrap; gap: 14px;">
      <div>
        <h1 style="display: flex; align-items: center; gap: 10px;">
          <svg class="icon-svg" viewBox="0 0 24 24" width="24" height="24" style="color: var(--secondary);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Panel de Gestión
        </h1>
        <p id="entityTitle" class="muted">Administración de usuarios, habilidades técnicas, habilidades personales y registros</p>
      </div>
      <div id="entityTabs" class="chip-group" aria-label="Secciones de gestión"></div>
      <select id="entitySelectMobile" class="admin-entity-select-mobile" aria-label="Seleccionar sección de gestión"></select>
    </div>

    <div id="adminAlert"></div>

    <section class="card admin-table-card">
      <div class="admin-table-toolbar">
        <div class="admin-toolbar-heading">
          <h2 id="tableTitle">Registros</h2>
          <button id="createEntityBtn" class="btn btn-primary" type="button" hidden>+ Agregar</button>
        </div>
        <label class="admin-search-label">
          <span>Buscar</span>
          <input id="entitySearch" type="search" placeholder="Buscar en todos los campos" autocomplete="off" />
        </label>
      </div>
      <p class="admin-scroll-hint" aria-hidden="true">
        <svg class="icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        Desliza la tabla para ver más información y acciones
      </p>
      <div class="table-responsive admin-table-scroll">
        <table class="admin-table">
          <thead><tr id="entityTableHead"></tr></thead>
          <tbody id="entityTableBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="empty-state" hidden></p>
    </section>
  </main>

  <div id="editDialog" class="admin-dialog" hidden>
    <section class="admin-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle">
      <div class="flex-between admin-dialog-heading">
        <h2 id="editDialogTitle">Editar registro</h2>
        <button id="closeEditDialog" class="admin-icon-button" type="button" aria-label="Cerrar">✕</button>
      </div>
      <form id="editForm">
        <div id="editFields" class="admin-form-fields"></div>
        <div class="admin-dialog-actions">
          <button id="cancelEdit" class="btn btn-secondary" type="button">Cancelar</button>
          <button id="saveEdit" class="btn btn-primary" type="submit">Guardar cambios</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/js/api.js?v=20261117c"></script>
  <script src="/js/ui.js?v=20261117c"></script>
  <script src="/js/admin.js?v=20261124_colores"></script>
</body>
</html>
