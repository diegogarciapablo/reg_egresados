server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    # Compresion ligera para ahorrar ancho de banda en el VPS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 512;

    # Control de cache para evitar que el navegador guarde versiones viejas de JS/CSS
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Archivos estaticos del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de respaldo para rutas relativas /api/ (fotos y certificados digitales)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
