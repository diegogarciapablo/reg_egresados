<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesion - Registro de Egresados</title>
  <link rel="stylesheet" href="/styles.css?v=20261117d" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container" style="max-width: 420px;">
    <div class="card">
      <h1>Iniciar sesion</h1>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electronico</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="password" style="margin-bottom: 0;">Contrasena</label>
            <a href="/recuperar-password.html" style="font-size: 0.85rem; color: var(--primary); font-weight: 600;">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Ingresar</button>
      </form>
      <div style="margin-top: 14px; text-align: center;">
        <a href="/recuperar-password.html" class="btn btn-secondary" style="width: 100%; display: inline-flex; justify-content: center; align-items: center; gap: 6px; font-size: 0.9rem;">
          🔑 Restablecer contraseña
        </a>
      </div>
      <p class="hint" style="margin-top:14px; text-align: center;">
        ¿No tienes cuenta? <a href="/registro.html">Crea una aqui</a>
      </p>
      <p class="hint" style="margin-top:8px; text-align: center;">
        <a href="#" id="viewTermsLinkLogin" style="font-size:0.85rem; color:#64748b; text-decoration: underline;">Consultar Términos y Condiciones</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js?v=20261117c"></script>
  <script src="/js/ui.js?v=20261117c"></script>
  <script src="/js/login.js?v=20261117c"></script>
</body>
</html>
