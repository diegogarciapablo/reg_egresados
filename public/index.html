<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directorio de Egresados - Ingenieria Informatica UAJMS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="container">
    <div class="page-header">
      <h1>Directorio de egresados</h1>
      <p class="muted">Explora las fichas profesionales de egresados de Ingenieria Informatica, UAJMS.</p>
    </div>

    <form id="filtersForm" class="card filters-bar">
      <div class="form-group">
        <label for="q">Buscar</label>
        <input type="text" id="q" name="q" placeholder="Nombre, cargo, tecnologia..." />
      </div>
      <div class="form-group">
        <label for="technology">Tecnologia</label>
        <select id="technology" name="technology">
          <option value="">Todas</option>
        </select>
      </div>
      <div class="form-group">
        <label for="yearFrom">Ano de egreso (desde)</label>
        <input type="number" id="yearFrom" name="yearFrom" placeholder="Ej: 2018" min="1950" max="2100" />
      </div>
      <div class="form-group">
        <label for="yearTo">Ano de egreso (hasta)</label>
        <input type="number" id="yearTo" name="yearTo" placeholder="Ej: 2024" min="1950" max="2100" />
      </div>
      <button type="submit" class="btn btn-primary">Filtrar</button>
    </form>

    <div id="resultsInfo" class="hint" style="margin-bottom: 12px;"></div>
    <div id="directoryGrid" class="card-grid"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/directory.js"></script>
</body>
</html>
