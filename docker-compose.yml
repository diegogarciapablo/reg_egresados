services:
  db:
    image: postgres:16
    container_name: egresados_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - egresados_pg_data:/var/lib/postgresql/data
    networks:
      - egresados_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: egresados_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - egresados_network
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: egresados_app
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/multimedia:/usr/src/app/backend/multimedia
      - ./frontend:/usr/src/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - egresados_network
    restart: unless-stopped

volumes:
  egresados_pg_data:

networks:
  egresados_network:
